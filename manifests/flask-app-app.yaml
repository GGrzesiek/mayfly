apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/GGrzesiek/execon-platform.git
    targetRevision: HEAD
    path: charts/flask-app
    helm:
      parameters:
        - name: image.repository
          value: "945695383505.dkr.ecr.eu-west-1.amazonaws.com/flask-app"
  destination:
    server: https://kubernetes.default.svc
    namespace: flask-app
  # The HPA owns spec.replicas. Even though the chart no longer renders that
  # field, this keeps selfHeal from reverting the HPA's scaling decisions if
  # hpa.enabled is ever turned off, or another controller writes the field.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
