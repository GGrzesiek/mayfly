name: Terraform

on:
  pull_request:
    paths: ["infra/**"]

permissions:
  contents: read

jobs:
  # Everything that can be checked without touching AWS. Always runs, so a PR
  # gets real feedback whether or not the cluster happens to exist today.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Format
        run: terraform fmt -check -recursive infra/

      - name: Validate
        run: |
          terraform -chdir=infra/environments/dev init -backend=false
          terraform -chdir=infra/environments/dev validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: cd infra && tflint --recursive --format compact

  # Needs live AWS. This project runs on kind by default and only stands up
  # EKS for a recorded demo, so the plan is opt-in: set the repository
  # variable AWS_PROVISIONED=true while the infrastructure is up. Without it
  # the job is skipped rather than failed — a check that is red whenever AWS
  # is intentionally down teaches everyone to ignore red checks.
  plan:
    needs: validate
    if: vars.AWS_PROVISIONED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Init
        run: terraform init

      # `shell: bash` sets pipefail. Without it the exit code came from tee,
      # so a failing plan reported success.
      - name: Plan
        shell: bash
        run: terraform plan -no-color 2>&1 | tee plan-output.txt

      # hashFiles guards the file: with `always()` alone this step ran even
      # when an earlier step failed, crashed on ENOENT, and reported itself as
      # the cause of the failure instead of the step that actually broke.
      - name: Post plan as PR comment
        if: always() && hashFiles('infra/environments/dev/plan-output.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('infra/environments/dev/plan-output.txt', 'utf8');
            const body = raw.length > 60000 ? raw.slice(0, 60000) + '\n...(truncated)' : raw;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${body}\n\`\`\``
            });
