name: CI

on:
  push:
    branches: [master]
    paths: ["app/**", "charts/flask-app/**"]

permissions:
  id-token: write
  contents: write

env:
  ECR_REPOSITORY: flask-app
  AWS_REGION: eu-west-1

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # The account id is not a secret in the cryptographic sense, but it is an
      # identifier worth keeping out of a public repo: it enables role-name
      # enumeration and targeted support-desk social engineering. The `secrets`
      # context is not available in workflow-level `env`, hence job level.
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint
        run: flake8 app/src app/tests --max-line-length=100

      - name: Test with coverage
        run: |
          cd app
          pytest tests/ -v --cov=src --cov-fail-under=80

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:git-${{ github.sha }} \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            app/

      # Pinned by commit digest rather than tag. The old reference was
      # @0.20.0 while the upstream tag is v0.20.0, so the job failed during
      # "Set up job" and this scan has never once executed. A tag can also be
      # moved or deleted by its owner after review; a digest cannot.
      - name: Scan image with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:git-${{ github.sha }}"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Push to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:git-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update image tag in Helm values
        run: |
          sed -i "s|  tag: .*|  tag: \"git-${{ github.sha }}\"|" charts/flask-app/values.yaml
          git config user.email "ci@github-actions"
          git config user.name "GitHub Actions"
          git add charts/flask-app/values.yaml
          git diff --staged --quiet || git commit -m "ci: update flask-app image to git-${{ github.sha }}"
          git push
