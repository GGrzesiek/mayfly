# Local cluster for `make demo`. Single node: the demo shows GitOps,
# reconcile and observability, none of which need more than one.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Pinned by digest rather than following kind's default, so a kind upgrade
    # cannot silently change the Kubernetes version under the demo. Digest is
    # from the kind v0.33.0 release notes; images are built per kind release.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
