{{/*
`{{ $value }}` and `{{ $labels.* }}` are Prometheus annotation templating, not
Helm. They are wrapped in backtick raw-string literals so Helm emits them
verbatim instead of trying to resolve them at render time.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flask-app-alerts
spec:
  groups:
    - name: flask-app.rules
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            (
              rate(http_requests_total{status=~"5.."}[2m]) /
              rate(http_requests_total[2m])
            ) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Flask app error rate above 5%"
            description: "Error rate is {{ `{{ $value | humanizePercentage }}` }} over the last 2 minutes."

        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99,
              rate(http_request_duration_seconds_bucket[5m])
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Flask app p99 latency above 500ms"
            description: "p99 latency is {{ `{{ $value | humanizeDuration }}` }}."

        - alert: FrequentPodRestarts
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="flask-app"
            }[10m]) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ `{{ $labels.pod }}` }} restarting frequently"
            description: "{{ `{{ $value }}` }} restarts in the last 10 minutes."
