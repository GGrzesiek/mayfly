image:
  # Injected at bootstrap, never committed — an ECR URL carries the AWS
  # account id, and this repo is public. Rendering fails loudly if unset.
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

# Only used when hpa.enabled is false — otherwise the HPA owns spec.replicas.
replicaCount: 2

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

serviceMonitor:
  enabled: true
  interval: "15s"
  path: /metrics
